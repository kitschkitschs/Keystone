.tcat>.mono i{width:7px;height:7px;border-radius:50%}
.tcond{padding:6px 16px 10px}
.vdrop.idrop{max-height:calc(100% - 140px);overflow-y:auto}
.vdrop.idrop button{display:flex;align-items:center;gap:10px;padding:9px 12px}
.vdrop.idrop b{flex:1;min-width:0;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vdrop.idrop span:last-child:not(.imini):not(.ihzm){font-size:13px;color:var(--quiet)}
.idrop .imini{display:grid;place-items:center;width:22px;color:var(--quiet)}

/* dark mode (2026-11-08, from the cleaning-system reference): warm near-black page, soft charcoal cards with a faint light edge */
html.dark{--page:#1D1B19;--card:#2B2926;--ink:#EFEAE2;--ink2:#CFC8BC;--quiet:#A59E92;--faint:#7F786E;--faint2:#5F5952;--line:#3D3934;--line2:#35322E;--soft:#36332F;--wash:#3A3226;--washline:#5C4B33;--star:#C9A86F;--done:#8FA488;color-scheme:dark}
html.dark .card,html.dark .lcard{background:linear-gradient(160deg,#33302C 0%,#2A2825 60%,#272522 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.3)}
html.dark .vcard{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 8px rgba(0,0,0,.35)}
html.dark .postit,html.dark .jcard,html.dark .notepaper,html.dark .sheet.notesh,html.dark .notesh{background-color:#34312C;color:var(--ink)}
html.dark .postit{background-image:none}html.dark .postit .pt,html.dark .postit .pl{border-color:#433F39}
html.dark .jcard{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 19px,#433F39 19px,#433F39 20px)}
html.dark .postit .pt{color:var(--ink)}html.dark .postit .pls{color:var(--ink2);background-image:linear-gradient(transparent 21px,#433F39 21px)}html.dark .postrow .postit .pls{background-image:linear-gradient(transparent 19px,#433F39 19px)}html.dark .postit .pl{color:var(--ink2)}
html.dark .scrim{background:rgba(0,0,0,.5)}
html.dark .menu,html.dark .sheet{box-shadow:0 12px 32px rgba(0,0,0,.55)}
html.dark #viewer.vwph{background:rgba(29,27,25,.3)}
html.dark img{opacity:.96}
html.dark .feelcard.empty{background:#33302C}html.dark .jcard .jct,html.dark .jct{color:var(--ink2)}html.dark .pjpdf{background:#3A3732}
/* breaks (2026-11-11): a named stretch of a block, nothing to tick */
.brkt{display:flex;align-items:center;justify-content:center;width:100%;height:16px;min-height:0;margin:6px 0;box-sizing:border-box;border-top:1px dashed var(--faint2);border-bottom:1px dashed var(--faint2);background:none;padding:0}
.brkt .bkt{font-size:8.5px;gap:6px}
.row.brkrow{gap:8px}.row.brkmin{padding:0;min-height:0}.row.brkrow .bico{display:grid;place-items:center;width:28px;height:28px;margin:-6px -4px;color:var(--ink2);flex:none}
.row.brkrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .box.brk{background:transparent!important;border:0!important;border-top:1px dashed var(--faint2)!important;border-bottom:1px dashed var(--faint2)!important;border-radius:0!important;box-shadow:none!important;left:-2px;right:-2px;color:var(--faint)!important;display:flex;align-items:center;justify-content:center;padding:0}
.bkt{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.bkt svg{flex:none}
.tl .box.brk.nt{border-top-color:transparent!important}.tl .box.brk.nb{border-bottom-color:transparent!important}
.tl .blab.bkl{display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
/* block titles sit centred over the weekday columns, not over the hour column too */
.bl{padding-left:24px}

.stepopts{margin:2px 0 12px;padding:10px 12px 4px;border-radius:12px;background:var(--page);display:flex;flex-direction:column;gap:6px}.stepopts .chips{margin-bottom:4px}.optic{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--ink2);opacity:.8}.steplink{display:flex;align-items:center;gap:8px;color:var(--ink)}.stepnote{margin:-2px 0 8px 4px;font-size:10.5px;color:var(--ink2)}
.hxt{margin-left:8px;white-space:nowrap;vertical-align:1px}
.cleft{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:10px 2px 0;font-size:13.5px;color:var(--ink2)}.cleft .mono{flex:none}.counts{grid-template-columns:repeat(4,minmax(0,1fr))!important}.pgrid:not(.x){grid-template-columns:44px repeat(4,minmax(0,1fr))!important}
.jmsup{display:flex;flex-direction:column;gap:2px;padding:2px 14px 8px}.jmsup b{font-family:var(--serif);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}.jmsup small{font-size:12.5px;color:var(--quiet)}
